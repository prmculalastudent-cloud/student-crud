services:
  # ── Backend (Docker / Spring Boot) ──────────────────────────────────────────
  - type: web
    name: student-backend
    env: docker
    plan: free
    dockerfilePath: ./student/Dockerfile
    dockerContext: ./student
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: student-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: student-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: student-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: student-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: student-db
          property: password
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: DB_SSL_MODE
        value: require
      - key: PORT
        value: "8080"

  # ── Frontend (Static / Vite React) ──────────────────────────────────────────
  - type: web
    name: student-frontend
    env: static
    plan: free
    buildCommand: cd student-frontend && npm install && npm run build
    staticPublishPath: student-frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://student-backend.onrender.com

databases:
  # ── Managed PostgreSQL Database ─────────────────────────────────────────────
  - name: student-db
    plan: free
    databaseName: db_student
